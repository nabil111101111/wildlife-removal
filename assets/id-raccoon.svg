<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" role="img" aria-label="Raccoon identification diagram">
<rect width="700" height="340" fill="#f6f3ec"/>
<text x="30" y="42" font-size="24" font-family="sans-serif" font-weight="bold">Raccoon: field identification</text>
<g fill="#5b7a4e"><ellipse cx="70" cy="150" rx="13" ry="20"/><ellipse cx="108" cy="168" rx="13" ry="20"/><ellipse cx="146" cy="150" rx="13" ry="20"/><ellipse cx="184" cy="168" rx="13" ry="20"/><ellipse cx="222" cy="150" rx="13" ry="20"/></g>
<text x="30" y="215" font-size="15" font-family="sans-serif">Tracks</text>
<text x="30" y="238" font-size="12" font-family="sans-serif">Hind track about 4 inches long with five long toes, looks like a tiny hand.</text>
<g fill="#7a5b3a"><rect x="300" y="140" width="16" height="34" rx="8"/><rect x="326" y="140" width="16" height="34" rx="8"/><rect x="352" y="140" width="16" height="34" rx="8"/></g>
<text x="290" y="215" font-size="15" font-family="sans-serif">Droppings</text>
<text x="290" y="238" font-size="12" font-family="sans-serif">Droppings 2 to 3 inches, tubular, often full of seeds and berries. Latrine sites repeat in the same spot.</text>
<rect x="30" y="275" width="300" height="10" fill="#999"/><rect x="30" y="275" width="150" height="10" fill="#333"/>
<text x="30" y="268" font-size="15" font-family="sans-serif">Size</text>
<text x="30" y="312" font-size="12" font-family="sans-serif">Adult 10 to 30 lb, roughly the size of a large house cat, with a ringed tail and masked face.</text>
<text x="420" y="290" font-size="12" font-family="sans-serif">Diagram is illustrative, drawn for this site.</text>
</svg>
